# Local development. Both services read secrets from .env files -- copy
# backend/.env.example -> backend/.env and frontend/.env.local.example ->
# frontend/.env.local and fill in real values before running.
#
# This does NOT include a local Postgres container on purpose: per your
# setup, the database is Aiven-hosted Postgres, used for both local dev
# and production. If you'd rather run Postgres locally too, add a
# `postgres:16` service with the pgvector extension and point
# DATABASE_URL at it instead.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app # live-reload friendly for local dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
